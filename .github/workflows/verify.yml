name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  suite:
    # macOS is not redundant coverage. Its system bash is 3.2 and its sed is BSD,
    # and both have already shipped breakage this suite could not see from ubuntu
    # alone: a `mapfile` that exits 127 and a `sed -i` that reads the script as a
    # backup suffix. Neither reproduces on GNU userland (ADR 0027).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        run: ./install-tools.sh
      - name: Verify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just ci

  # A matrix renames its checks to `job (axis)`, so the bare `verify` context that
  # branch protection requires would stop reporting and every PR would sit BLOCKED
  # on a check that never arrives. This job keeps that context stable, so adding or
  # dropping an OS above stays a workflow change and never a repo-settings change.
  #
  # `if: always()` is what makes it a gate rather than a rubber stamp: without it a
  # failed or cancelled matrix skips this job, and a skipped required check reads as
  # success to branch protection. The result is then asserted explicitly.
  verify:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The hook bodies are proven POSIX by re-running them under sh, which establishes
      # nothing where sh is an extended shell -- so every environment but a dash one skips,
      # and the property used to be proven by the ubuntu matrix leg alone. Proving it here
      # instead takes the guarantee out of the matrix: dropping a leg or re-homing one cannot
      # remove this job, and an image whose /bin/sh stops being dash reds it rather than
      # skipping quietly. POSIX_ASSERTIONS_REQUIRED is what refuses the skip (ADR 0053), and
      # scripts/claude-settings-posix-guard-test.sh fails if this step, or this job's
      # if: always(), stops being what the gate needs.
      # It runs before the matrix assertion because a leg's result is legible from its own
      # check entry and this verdict is reported nowhere else.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove the hook bodies are POSIX
        env:
          POSIX_ASSERTIONS_REQUIRE: '1'
        run: ./scripts/claude-settings-hooks-test.sh
      - name: Check matrix result
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          if [ "$SUITE_RESULT" != success ]; then
            printf 'verify: suite matrix reported %s\n' "$SUITE_RESULT" >&2
            exit 1
          fi
          printf 'verify: every suite leg passed\n'
